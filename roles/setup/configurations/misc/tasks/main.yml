---
# tasks file for misc
# Foot (Terminal)
- name: Configuring Foot...
  become: true
  become_user: "{{target_user}}"
  become_method: su
  file:
    path: "{{target_home_dir}}/.config/foot/"
    state: directory

- name:
  become: true
  become_user: "{{target_user}}"
  become_method: su
  copy:
    src: "{{target_home_dir}}/arch-build/roles/setup/configurations/misc/files/foot.ini"
    dest: "{{target_home_dir}}/.config/foot/foot.ini"

# Dolphin
- name: Configuring Dolphin...
  become: true
  become_method: su
  copy:
    src: "{{ target_home_dir }}/arch-build/roles/setup/configurations/misc/files/{{ item }}"
    dest: "{{ target_home_dir }}/.config/"
  loop:
    - kdeglobals
    - dolphinrc

# SDDM Astronaut Theme
- name: Configuring SDDM...
  become: true
  become_method: su
  file:
    path: "/etc/sddm.conf.d/"
    state: directory

- name:
  become: true
  become_method: su
  copy:
    src: "{{ target_home_dir }}/arch-build/roles/setup/configurations/misc/files/theme.conf"
    dest: "/etc/sddm.conf.d/"

- name:
  become: true
  become_method: su
  copy:
    src: "{{ target_home_dir }}/arch-build/roles/setup/configurations/misc/files/metadata.desktop"
    dest: "/usr/share/sddm/themes/sddm-astronaut-theme/"
