config_version = 14

[bar.default]
smart_auto_hide = true

[control_center]
hidden_tabs = [ "power", "bluetooth" ]

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 695.25
    output = "Virtual-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Roboto"

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "muted"

[wallpaper.default]
path = "/home/showen/Pictures/Wallpapers/2917197433_preview_1086796.jpg"

[wallpaper.last]
path = "/home/showen/Pictures/Wallpapers/2917197433_preview_1086796.jpg"

[wallpaper.monitors.Virtual-1]
path = "/home/showen/Pictures/Wallpapers/2917197433_preview_1086796.jpg"